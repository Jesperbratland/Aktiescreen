# 🎄 Jultema – vinternatt med guldaccenter, i iOS-stil.
# Vill du byta tillbaka efter jul: sätt JULTEMA = False i ui.py och
# ändra primaryColor till "#3B82F6" och bakgrunderna till "#0B1220" / "#131C2E".
[theme]
base = "dark"
primaryColor = "#E8B44C"
backgroundColor = "#0C1A17"
secondaryBackgroundColor = "#142721"
textColor = "#F4EFE6"

# iOS-typsnitt: San Francisco på iPhone/Mac, Inter (närmast SF) på Windows/Android
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', Roboto, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, 'Segoe UI', Roboto, sans-serif"
headingFontSizes = ["2.125rem", "1.375rem", "1.25rem", "1.0625rem", "1rem", "0.9375rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontWeight = 650

# Mjuka iOS-former: rundade hörn, inga ramar runt fält
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = false
showSidebarBorder = false
borderColor = "#22362F"
dataframeBorderColor = "#1E332B"
dataframeHeaderBackgroundColor = "#142721"

[server]
headless = true
